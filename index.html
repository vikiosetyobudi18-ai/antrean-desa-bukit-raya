<!DOCTYPE html>
<html lang="id">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"

<title>
    Panel Antrean Desa Bukit Raya
</title>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, Helvetica, sans-serif;
    background: #f4f8fc;
    color: #222;
}

.app {
    max-width: 1100px;
    margin: auto;
    padding: 30px 20px 50px;
}

.header {
    text-align: center;
    margin-bottom: 25px;
}

.header h1 {
    margin: 0;
    color: #1769aa;
    font-size: 34px;
}

.header p {
    color: #777;
    margin: 8px 0 0;
}


/* =========================================
   LOKET
========================================= */

.loket-container {
    display: grid;
    grid-template-columns:
        repeat(4, 1fr);

    gap: 12px;

    margin-bottom: 18px;
}

.loket {
    position: relative;

    padding: 16px;

    border:
        2px solid #1769aa;

    border-radius: 10px;

    background: white;

    color: #1769aa;

    text-align: center;

    font-weight: bold;

    cursor: pointer;

    transition: .2s;
}

.loket.active {
    background: #1769aa;
    color: white;
}

.loket.waiting {
    border-color: #dc3545;
    box-shadow:
        0 0 0 3px
        rgba(220,53,69,.12);
}

.loket-badge {
    position: absolute;

    top: -9px;
    right: -9px;

    min-width: 26px;
    height: 26px;

    padding: 5px 7px;

    border-radius: 50%;

    background: #dc3545;

    color: white;

    font-size: 12px;

    line-height: 16px;

    display: none;
}

.loket-badge.show {
    display: block;
}


/* =========================================
   STATUS RINGKAS
========================================= */

.status-grid {

    display: grid;

    grid-template-columns:
        repeat(4, 1fr);

    gap: 12px;

    margin-bottom: 20px;
}

.status-item {

    background: white;

    border-radius: 12px;

    padding: 15px;

    text-align: center;

    box-shadow:
        0 4px 15px
        rgba(0,0,0,.06);

}

.status-item-title {

    font-weight: bold;

    color: #1769aa;

}

.status-count {

    font-size: 28px;

    font-weight: bold;

    margin-top: 6px;

}

.status-text {

    color: #777;

    font-size: 13px;

}

.status-item.has-waiting {

    border:
        2px solid #dc3545;

}


/* =========================================
   NOTIFIKASI
========================================= */

.notification {

    display: none;

    position: relative;

    background: #fff4d6;

    border:
        2px solid #f0ad4e;

    color: #7a4d00;

    border-radius: 14px;

    padding: 18px 45px 18px 18px;

    margin-bottom: 20px;

    box-shadow:
        0 5px 20px
        rgba(240,173,78,.15);

}

.notification.show {
    display: block;
}

.notification-title {

    font-size: 18px;

    font-weight: bold;

    margin-bottom: 6px;

}

.notification-close {

    position: absolute;

    right: 14px;

    top: 10px;

    border: none;

    background: none;

    font-size: 22px;

    color: #7a4d00;

    cursor: pointer;

}


/* =========================================
   PETUGAS
========================================= */

.petugas {

    background: white;

    border-radius: 16px;

    padding: 22px;

    text-align: center;

    box-shadow:
        0 5px 20px
        rgba(0,0,0,.07);

    margin-bottom: 20px;

}

.petugas small {
    color: #888;
}

.petugas h2 {

    margin:
        6px 0;

    color: #1769aa;

}


/* =========================================
   ANTREAN AKTIF
========================================= */

.antrean-card {

    background: white;

    border-radius: 18px;

    padding: 40px 25px;

    text-align: center;

    box-shadow:
        0 5px 25px
        rgba(0,0,0,.08);

}

.antrean-kosong {

    padding: 40px;

    color: #777;

    font-size: 20px;

}

.nomor {

    color: #1769aa;

    font-size: 92px;

    font-weight: 800;

    line-height: 1;

    margin: 12px 0;

}

.nama {

    font-size: 30px;

    font-weight: bold;

}

.layanan {

    color: #666;

    margin-top: 8px;

    font-size: 18px;

}

.status {

    display: inline-block;

    margin-top: 16px;

    padding: 9px 20px;

    border-radius: 30px;

    background: #eaf5ff;

    color: #1769aa;

    font-weight: bold;

}


/* =========================================
   PESAN
========================================= */

.pesan {

    margin: 18px 0;

    min-height: 24px;

    font-weight: bold;

}

.error {
    color: #c62828;
}

.success {
    color: #16853a;
}


/* =========================================
   TOMBOL
========================================= */

.tombol-container {

    margin-top: 25px;

    display: grid;

    grid-template-columns:
        repeat(2, 1fr);

    gap: 12px;

}

.tombol {

    padding: 18px;

    border: none;

    border-radius: 10px;

    color: white;

    font-size: 16px;

    font-weight: bold;

    cursor: pointer;

}

.tombol:disabled {

    opacity: .45;

    cursor: not-allowed;

}

.panggil {

    grid-column: span 2;

    background: #1769aa;

    font-size: 19px;

}

.ulang {
    background: #f0ad4e;
}

.mulai {
    background: #28a745;
}

.selesai {
    background: #20a0a0;
}

.lewati {
    background: #dc3545;
}


/* =========================================
   RESPONSIVE
========================================= */

@media (max-width: 700px) {

    .loket-container {
        grid-template-columns:
            repeat(2, 1fr);
    }

    .status-grid {
        grid-template-columns:
            repeat(2, 1fr);
    }

    .nomor {
        font-size: 65px;
    }

    .nama {
        font-size: 23px;
    }

    .tombol-container {
        grid-template-columns: 1fr;
    }

    .panggil {
        grid-column: span 1;
    }

}

</style>

</head>

<script>


/* =========================================
   SUPABASE
========================================= */

const SUPABASE_URL =
    "https://pyawggjlbrvneflpsalj.supabase.co";


const SUPABASE_KEY =
    "sb_publishable_5SdvMobBB2AvtXcJd_Scxw_rVsoqM8R";


const db =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


/* =========================================
   DATA LOKET
========================================= */

const loketData = {

    A: {
        nama: "LOKET A",
        petugas: "Arman"
    },

    B: {
        nama: "LOKET B",
        petugas: "Vikio"
    },

    C: {
        nama: "LOKET C",
        petugas: "Dilla"
    },

    D: {
        nama: "LOKET D",
        petugas: "Ayu"
    }

};


let loketAktif =
    "B";


let antreanAktif =
    null;


/*
 * Menyimpan ID antrean waiting
 * yang sudah diketahui panel.
 */

let waitingIds =
    new Set();


let pertamaKali =
    true;


/* =========================================
   ELEMENT
========================================= */

const antreanContent =
    document.getElementById(
        "antreanContent"
    );


const pesan =
    document.getElementById(
        "pesan"
    );


const namaLoket =
    document.getElementById(
        "namaLoket"
    );


const namaPetugas =
    document.getElementById(
        "namaPetugas"
    );


const btnPanggil =
    document.getElementById(
        "btnPanggil"
    );


const btnUlang =
    document.getElementById(
        "btnUlang"
    );


const btnMulai =
    document.getElementById(
        "btnMulai"
    );


const btnSelesai =
    document.getElementById(
        "btnSelesai"
    );


const btnLewati =
    document.getElementById(
        "btnLewati"
    );


const notification =
    document.getElementById(
        "notification"
    );


const notificationText =
    document.getElementById(
        "notificationText"
    );


const notificationClose =
    document.getElementById(
        "notificationClose"
    );


/* =========================================
   TANGGAL LOKAL BROWSER
========================================= */

function tanggalHariIni() {

    const now =
        new Date();

    const year =
        now.getFullYear();

    const month =
        String(
            now.getMonth() + 1
        ).padStart(
            2,
            "0"
        );

    const day =
        String(
            now.getDate()
        ).padStart(
            2,
            "0"
        );

    return (
        year +
        "-" +
        month +
        "-" +
        day
    );

}


/* =========================================
   PESAN
========================================= */

function tampilPesan(
    text,
    type
) {

    pesan.textContent =
        text || "";


    pesan.className =
        "pesan " +
        (type || "");

}


/* =========================================
   SUARA NOTIFIKASI
========================================= */

function bunyiNotifikasi() {

    try {

        const AudioContext =
            window.AudioContext ||
            window.webkitAudioContext;


        if (!AudioContext) {
            return;
        }


        const ctx =
            new AudioContext();


        const oscillator =
            ctx.createOscillator();


        const gain =
            ctx.createGain();


        oscillator.connect(
            gain
        );


        gain.connect(
            ctx.destination
        );


        oscillator.frequency.value =
            880;


        oscillator.type =
            "sine";


        gain.gain.setValueAtTime(
            0.0001,
            ctx.currentTime
        );


        gain.gain.exponentialRampToValueAtTime(
            0.18,
            ctx.currentTime + 0.03
        );


        gain.gain.exponentialRampToValueAtTime(
            0.0001,
            ctx.currentTime + 0.35
        );


        oscillator.start(
            ctx.currentTime
        );


        oscillator.stop(
            ctx.currentTime + 0.35
        );

    } catch (e) {

        console.log(
            "Bunyi notifikasi tidak tersedia."
        );

    }

}


/* =========================================
   NOTIFIKASI
========================================= */

function tampilNotifikasi(
    loket,
    jumlah,
    contohNama
) {

    notificationText.innerHTML =
        "<strong>" +
        loketData[loket].nama +
        "</strong> memiliki " +
        "<strong>" +
        jumlah +
        " antrean</strong> yang sedang menunggu." +
        (
            contohNama
                ? "<br>Contoh: " +
                  contohNama
                : ""
        );


    notification.classList.add(
        "show"
    );


    document.title =
        "🔔 Antrean Baru • Panel Antrean";


    bunyiNotifikasi();

}


notificationClose.addEventListener(
    "click",
    function () {

        notification.classList.remove(
            "show"
        );


        document.title =
            "Panel Antrean Desa Bukit Raya";

    }
);


/* =========================================
   RINGKASAN JUMLAH ANTREAN
========================================= */

function updateWaitingSummary(
    data
) {

    const counts = {

        A: 0,
        B: 0,
        C: 0,
        D: 0

    };


    const firstNames = {

        A: "",
        B: "",
        C: "",
        D: ""

    };


    data.forEach(
        function (row) {

            const code =
                row.counter_code;


            if (
                counts[code] !== undefined
            ) {

                counts[code]++;


                if (
                    !firstNames[code]
                ) {

                    firstNames[code] =
                        row.customer_name;

                }

            }

        }
    );


    ["A","B","C","D"]
        .forEach(
            function (code) {

                document.getElementById(
                    "count" + code
                ).textContent =
                    counts[code];


                const status =
                    document.getElementById(
                        "status" + code
                    );


                const badge =
                    document.getElementById(
                        "badge" + code
                    );


                const loket =
                    document.querySelector(
                        '[data-counter="' +
                        code +
                        '"]'
                    );


                if (
                    counts[code] > 0
                ) {

                    status.classList.add(
                        "has-waiting"
                    );


                    badge.textContent =
                        counts[code];


                    badge.classList.add(
                        "show"
                    );


                    loket.classList.add(
                        "waiting"
                    );

                } else {

                    status.classList.remove(
                        "has-waiting"
                    );


                    badge.textContent =
                        "";


                    badge.classList.remove(
                        "show"
                    );


                    loket.classList.remove(
                        "waiting"
                    );

                }

            }
        );


    return {

        counts:
            counts,

        names:
            firstNames

    };

}


/* =========================================
   CEK ANTREAN WAITING
========================================= */

async function cekAntreanMenunggu() {

    try {

        const result =
            await db
                .from("queues")
                .select(
                    `
                    id,
                    queue_code,
                    customer_name,
                    counter_id,
                    status,
                    queue_date,
                    counters (
                        code
                    )
                    `
                )
                .eq(
                    "queue_date",
                    tanggalHariIni()
                )
                .eq(
                    "status",
                    "waiting"
                )
                .order(
                    "id",
                    {
                        ascending: true
                    }
                );


        if (
            result.error
        ) {

            console.error(
                "Gagal membaca waiting:",
                result.error
            );


            return;

        }


        const rows =
            (result.data || [])
                .map(
                    function (row) {

                        return {

                            id:
                                row.id,

                            queue_code:
                                row.queue_code,

                            customer_name:
                                row.customer_name,

                            counter_code:
                                row.counters?.code ||
                                ""

                        };

                    }
                );


        const summary =
            updateWaitingSummary(
                rows
            );


        /*
         * ID waiting saat ini.
         */

        const currentIds =
            new Set(
                rows.map(
                    function (row) {
                        return row.id;
                    }
                )
            );


        /*
         * Pada pengecekan pertama,
         * jangan bunyikan notifikasi
         * untuk antrean lama.
         */

        if (!pertamaKali) {

            let newRows =
                rows.filter(
                    function (row) {

                        return !waitingIds.has(
                            row.id
                        );

                    }
                );


            if (
                newRows.length > 0
            ) {

                /*
                 * Cari loket pertama
                 * yang mendapatkan antrean baru.
                 */

                const row =
                    newRows[0];


                const loket =
                    row.counter_code;


                const jumlah =
                    summary.counts[
                        loket
                    ];


                tampilNotifikasi(
                    loket,
                    jumlah,
                    row.customer_name
                );

            }

        }


        waitingIds =
            currentIds;


        pertamaKali =
            false;


    } catch (error) {

        console.error(
            "cekAntreanMenunggu:",
            error
        );

    }

}


/* =========================================
   ANTREAN AKTIF LOKET TERPILIH
========================================= */

async function muatAntreanAktif() {

    try {

        const result =
            await db
                .from("queues")
                .select(
                    `
                    id,
                    queue_code,
                    customer_name,
                    service_id,
                    counter_id,
                    status,
                    services (
                        name
                    ),
                    counters (
                        code,
                        name
                    )
                    `
                )
                .eq(
                    "queue_date",
                    tanggalHariIni()
                )
                .eq(
                    "counter_id",
                    getCounterId(
                        loketAktif
                    )
                )
                .in(
                    "status",
                    [
                        "called",
                        "serving"
                    ]
                )
                .order(
                    "called_at",
                    {
                        ascending: false
                    }
                )
                .limit(1)
                .maybeSingle();


        if (
            result.error
        ) {

            console.error(
                "Gagal membaca aktif:",
                result.error
            );


            return;

        }


        if (
            !result.data
        ) {

            renderAntrean(
                null
            );

            return;

        }


        renderAntrean({

            queue_id:
                result.data.id,

            queue_code:
                result.data.queue_code,

            customer_name:
                result.data.customer_name,

            service_name:
                result.data.services?.name ||
                "",

            counter_name:
                result.data.counters?.name ||
                loketData[
                    loketAktif
                ].nama,

            status:
                result.data.status

        });


    } catch (error) {

        console.error(
            "muatAntreanAktif:",
            error
        );

    }

}


/* =========================================
   ID COUNTER
========================================= */

function getCounterId(
    code
) {

    if (
        code === "A"
    ) {
        return 1;
    }


    if (
        code === "B"
    ) {
        return 2;
    }


    if (
        code === "C"
    ) {
        return 3;
    }


    if (
        code === "D"
    ) {
        return 4;
    }


    return 1;

}


/* =========================================
   RENDER ANTREAN AKTIF
========================================= */

function renderAntrean(
    data
) {

    antreanAktif =
        data || null;


    if (!data) {

        antreanContent.innerHTML = `
            <div class="antrean-kosong">
                Belum ada antrean yang dipanggil.
            </div>
        `;


        btnUlang.disabled =
            true;


        btnMulai.disabled =
            true;


        btnSelesai.disabled =
            true;


        btnLewati.disabled =
            true;


        return;

    }


    const status =
        data.status === "serving"
            ? "SEDANG DILAYANI"
            : "DIPANGGIL";


    antreanContent.innerHTML = `

        <div>
            ANTREAN SAAT INI
        </div>

        <div class="nomor">
            ${data.queue_code}
        </div>

        <div class="nama">
            ${data.customer_name}
        </div>

        <div class="layanan">
            ${data.service_name}
        </div>

        <div class="status">
            ${status}
        </div>

    `;


    btnUlang.disabled =
        false;


    btnMulai.disabled =
        data.status !== "called";


    btnSelesai.disabled =
        data.status !== "called" &&
        data.status !== "serving";


    btnLewati.disabled =
        data.status !== "called" &&
        data.status !== "serving";

}


/* =========================================
   SUARA
========================================= */

function suaraAntrean(
    data
) {

    if (
        !window.speechSynthesis
    ) {

        return;

    }


    window.speechSynthesis.cancel();


    const text =
        "Nomor antrean " +
        data.queue_code +
        ", atas nama " +
        data.customer_name +
        ", silakan menuju " +
        data.counter_name;


    const utterance =
        new SpeechSynthesisUtterance(
            text
        );


    utterance.lang =
        "id-ID";


    utterance.rate =
        .85;


    window.speechSynthesis.speak(
        utterance
    );

}


/* =========================================
   PANGGIL
========================================= */

async function panggilAntrean() {

    btnPanggil.disabled =
        true;


    tampilPesan(
        "Memanggil antrean berikutnya..."
    );


    try {

        const result =
            await db.rpc(
                "panggil_antrean",
                {
                    p_counter_code:
                        loketAktif
                }
            );


        if (
            result.error
        ) {

            throw result.error;

        }


        if (
            !result.data ||
            !result.data.length
        ) {

            throw new Error(
                "Tidak ada antrean yang menunggu."
            );

        }


        renderAntrean(
            result.data[0]
        );


        tampilPesan(
            "Antrean berhasil dipanggil.",
            "success"
        );


        suaraAntrean(
            result.data[0]
        );


        /*
         * Perbarui indikator
         * antrean menunggu.
         */

        await cekAntreanMenunggu();

    } catch (error) {

        console.error(
            error
        );


        tampilPesan(
            error.message,
            "error"
        );

    } finally {

        btnPanggil.disabled =
            false;

    }

}


/* =========================================
   PANGGIL ULANG
========================================= */

async function panggilUlang() {

    if (
        !antreanAktif
    ) {

        return;

    }


    const result =
        await db.rpc(
            "panggil_ulang_antrean",
            {
                p_queue_id:
                    antreanAktif.queue_id
            }
        );


    if (
        result.error
    ) {

        tampilPesan(
            result.error.message,
            "error"
        );

        return;

    }


    if (
        result.data &&
        result.data.length
    ) {

        renderAntrean(
            result.data[0]
        );


        suaraAntrean(
            result.data[0]
        );

    }

}


/* =========================================
   MULAI
========================================= */

async function mulaiMelayani() {

    if (
        !antreanAktif
    ) {

        return;

    }


    const result =
        await db.rpc(
            "mulai_layani_antrean",
            {
                p_queue_id:
                    antreanAktif.queue_id
            }
        );


    if (
        result.error
    ) {

        tampilPesan(
            result.error.message,
            "error"
        );

        return;

    }


    antreanAktif.status =
        "serving";


    renderAntrean(
        antreanAktif
    );


    tampilPesan(
        "Antrean sedang dilayani.",
        "success"
    );

}


/* =========================================
   SELESAI
========================================= */

async function selesai() {

    if (
        !antreanAktif
    ) {

        return;

    }


    const result =
        await db.rpc(
            "selesaikan_antrean",
            {
                p_queue_id:
                    antreanAktif.queue_id
            }
        );


    if (
        result.error
    ) {

        tampilPesan(
            result.error.message,
            "error"
        );

        return;

    }


    renderAntrean(
        null
    );


    tampilPesan(
        "Pelayanan selesai.",
        "success"
    );

}


/* =========================================
   LEWATI
========================================= */

async function lewati() {

    if (
        !antreanAktif
    ) {

        return;

    }


    const result =
        await db.rpc(
            "lewati_antrean",
            {
                p_queue_id:
                    antreanAktif.queue_id
            }
        );


    if (
        result.error
    ) {

        tampilPesan(
            result.error.message,
            "error"
        );

        return;

    }


    renderAntrean(
        null
    );


    tampilPesan(
        "Antrean dilewati.",
        "success"
    );

}


/* =========================================
   PILIH LOKET
========================================= */

document
    .querySelectorAll(
        ".loket"
    )
    .forEach(
        function (element) {

            element.addEventListener(
                "click",
                async function () {

                    loketAktif =
                        this.dataset.counter;


                    document
                        .querySelectorAll(
                            ".loket"
                        )
                        .forEach(
                            function (item) {

                                item.classList
                                    .remove(
                                        "active"
                                    );

                            }
                        );


                    this.classList.add(
                        "active"
                    );


                    namaLoket.textContent =
                        loketData[
                            loketAktif
                        ].nama;


                    namaPetugas.textContent =
                        loketData[
                            loketAktif
                        ].petugas;


                    await muatAntreanAktif();

                }
            );

        }
    );


/* =========================================
   BUTTON
========================================= */

btnPanggil.addEventListener(
    "click",
    panggilAntrean
);


btnUlang.addEventListener(
    "click",
    panggilUlang
);


btnMulai.addEventListener(
    "click",
    mulaiMelayani
);


btnSelesai.addEventListener(
    "click",
    selesai
);


btnLewati.addEventListener(
    "click",
    lewati
);


/* =========================================
   INISIALISASI
========================================= */

renderAntrean(
    null
);


cekAntreanMenunggu();


/*
 * Cek otomatis setiap 3 detik.
 */

setInterval(
    cekAntreanMenunggu,
    3000
);


/*
 * Sinkronkan antrean aktif setiap 3 detik.
 */

setInterval(
    muatAntreanAktif,
    3000
);

</script>


</body>

</html>
