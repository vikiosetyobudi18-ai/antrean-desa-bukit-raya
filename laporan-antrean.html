<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Laporan Antrean - Desa Bukit Raya</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#f4f7fb;color:#172033}.wrap{max-width:1400px;margin:auto;padding:24px}.hidden{display:none!important}.card{background:#fff;border:1px solid #e3e9f2;border-radius:18px;box-shadow:0 8px 25px rgba(22,43,77,.07)}.head{background:#1459a6;color:#fff;border-radius:18px;padding:24px;margin-bottom:18px;display:flex;justify-content:space-between;gap:15px;align-items:center}.head h1{margin:0 0 5px}.head p{margin:0}.btn{border:0;border-radius:10px;padding:12px 17px;font-weight:800;cursor:pointer}.primary{background:#ffc400;color:#123b72}.light{background:#fff;color:#123b72}.danger{background:#c62828;color:#fff}.filters{padding:18px;margin-bottom:18px}.row{display:flex;gap:12px;align-items:end;flex-wrap:wrap}.field{flex:1;min-width:210px}.field label{display:block;font-weight:700;margin-bottom:7px}input{width:100%;padding:12px;border:1px solid #ccd5e2;border-radius:10px}.summary{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-bottom:18px}.stat{padding:18px}.stat small{color:#667085}.num{font-size:28px;font-weight:800;color:#1459a6;margin-top:5px}.counters{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:18px}.counter{padding:18px}.counter h3{margin:0 0 8px;color:#1459a6}.tablecard{padding:18px}.tabletop{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:14px}.tabletop h2{margin:0;color:#123b72}.search{max-width:360px}.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:1000px}th,td{padding:10px;border-bottom:1px solid #e7ebf0;text-align:left;font-size:14px}th{background:#f8fafc;white-space:nowrap}.badge{display:inline-block;padding:5px 9px;border-radius:999px;font-size:12px;font-weight:700}.waiting{background:#fff7d6;color:#8a6200}.called,.serving{background:#e8f1ff;color:#175cd3}.completed{background:#ecfdf3;color:#027a48}.skipped{background:#fef3f2;color:#b42318}.msg{padding:12px;border-radius:10px;margin-top:12px;font-size:14px}.ok{background:#ecfdf3;color:#027a48}.err{background:#fef3f2;color:#b42318}.empty{text-align:center;padding:35px;color:#667085}@media(max-width:900px){.summary{grid-template-columns:repeat(2,1fr)}.counters{grid-template-columns:repeat(2,1fr)}.head{flex-direction:column;align-items:flex-start}}@media(max-width:520px){.wrap{padding:14px}.summary,.counters{grid-template-columns:1fr}.head h1{font-size:24px}}
</style>
</head>
<body>
<div class="wrap">
  <div class="head">
    <div><h1>Laporan Antrean</h1><p>Rekap dan riwayat pelayanan Desa Bukit Raya</p></div>
    <div><button id="logout" class="btn danger">KELUAR</button></div>
  </div>

  <div class="card filters">
    <div class="row">
      <div class="field"><label for="date">Tanggal</label><input id="date" type="date"></div>
      <button id="load" class="btn primary">MUAT DATA</button>
      <button id="export" class="btn light">EXPORT CSV</button>
    </div>
    <div id="msg" class="msg hidden"></div>
  </div>

  <div class="summary">
    <div class="card stat"><small>TOTAL ANTREAN</small><div id="total" class="num">0</div></div>
    <div class="card stat"><small>MENUNGGU</small><div id="waiting" class="num">0</div></div>
    <div class="card stat"><small>DIPANGGIL / DILAYANI</small><div id="active" class="num">0</div></div>
    <div class="card stat"><small>SELESAI</small><div id="completed" class="num">0</div></div>
    <div class="card stat"><small>DILEWATI</small><div id="skipped" class="num">0</div></div>
  </div>

  <div id="counters" class="counters"></div>

  <div class="card tablecard">
    <div class="tabletop">
      <h2>Detail Antrean</h2>
      <input id="search" class="search" type="text" placeholder="Cari nama, nomor, atau pelayanan...">
    </div>
    <div id="table"></div>
  </div>
</div>

<script>
const SUPABASE_URL="https://pyawggjlbrvneflpsalj.supabase.co";
const SUPABASE_PUBLISHABLE_KEY="sb_publishable_5SdvMobBB2AvtXcJd_Scxw_rVsoqM8R";
const db=window.supabase.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY);
let rows=[];

const $=id=>document.getElementById(id);
function today(){const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function esc(v){return String(v??"").replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;").replaceAll("'","&#039;")}
function dt(v){if(!v)return "-";const d=new Date(v);return isNaN(d)?"-":d.toLocaleString("id-ID",{day:"2-digit",month:"2-digit",year:"numeric",hour:"2-digit",minute:"2-digit"})}
function msg(t,ok){$("msg").textContent=t;$("msg").className="msg "+(ok?"ok":"err")}
function badge(s){const m={waiting:"Menunggu",called:"Dipanggil",serving:"Dilayani",completed:"Selesai",skipped:"Dilewati"};return `<span class="badge ${s}">${m[s]||s||"-"}</span>`}

function render(){
  $("total").textContent=rows.length;
  $("waiting").textContent=rows.filter(x=>x.status==="waiting").length;
  $("active").textContent=rows.filter(x=>["called","serving"].includes(x.status)).length;
  $("completed").textContent=rows.filter(x=>x.status==="completed").length;
  $("skipped").textContent=rows.filter(x=>x.status==="skipped").length;

  const names={A:"Loket A",B:"Loket B",C:"Loket C",D:"Loket D"};
  $("counters").innerHTML=["A","B","C","D"].map(c=>{
    const r=rows.filter(x=>x.counter_code===c);
    return `<div class="card counter"><h3>${names[c]}</h3><div>Total: <b>${r.length}</b></div><div>Selesai: <b>${r.filter(x=>x.status==="completed").length}</b></div><div>Aktif: <b>${r.filter(x=>["called","serving"].includes(x.status)).length}</b></div></div>`;
  }).join("");
  renderTable();
}

function renderTable(){
  const q=$("search").value.trim().toLowerCase();
  const r=rows.filter(x=>!q||[x.queue_code,x.customer_name,x.service_name,x.counter_code,x.counter_name,x.status].some(v=>String(v??"").toLowerCase().includes(q)));
  if(!r.length){$("table").innerHTML='<div class="empty">Tidak ada data antrean untuk ditampilkan.</div>';return}
  $("table").innerHTML=`<div class="tablewrap"><table><thead><tr><th>No.</th><th>Nomor</th><th>Nama Pemohon</th><th>Pelayanan</th><th>Loket</th><th>Status</th><th>Daftar</th><th>Dipanggil</th><th>Mulai Dilayani</th><th>Selesai</th></tr></thead><tbody>${r.map((x,i)=>`<tr><td>${i+1}</td><td><b>${esc(x.queue_code)}</b></td><td>${esc(x.customer_name)}</td><td>${esc(x.service_name)}</td><td>${esc(x.counter_code)} — ${esc(x.counter_name)}</td><td>${badge(x.status)}</td><td>${dt(x.created_at)}</td><td>${dt(x.called_at)}</td><td>${dt(x.served_at)}</td><td>${dt(x.completed_at)}</td></tr>`).join("")}</tbody></table></div>`;
}

async function load(){
  const {data,error}=await db.rpc("laporan_antrean",{p_queue_date:$("date").value});
  if(error){msg(error.message||"Gagal memuat laporan.",false);return}
  rows=data||[];render();msg("Data laporan berhasil dimuat.",true);
}

function csv(){
  if(!rows.length){msg("Tidak ada data untuk diekspor.",false);return}
  const h=["No","Nomor Antrean","Nama Pemohon","Pelayanan","Loket","Nama Loket","Status","Daftar","Dipanggil","Mulai Dilayani","Selesai"];
  const d=rows.map((x,i)=>[i+1,x.queue_code,x.customer_name,x.service_name,x.counter_code,x.counter_name,x.status,x.created_at,x.called_at,x.served_at,x.completed_at]);
  const out=[h,...d].map(r=>r.map(v=>`"${String(v??"").replaceAll('"','""')}"`).join(",")).join("\n");
  const a=document.createElement("a");a.href=URL.createObjectURL(new Blob(["\uFEFF"+out],{type:"text/csv;charset=utf-8"}));a.download="laporan-antrean-"+$("date").value+".csv";a.click();
}

async function start(){
  const {data}=await db.auth.getSession();
  if(!data||!data.session){window.location.replace("laporan-login.html");return}
  $("date").value=today();
  await load();
}
$("load").onclick=load;$("export").onclick=csv;$("search").oninput=renderTable;
$("logout").onclick=async()=>{await db.auth.signOut();window.location.replace("laporan-login.html")};
start();
</script>
</body>
</html>
