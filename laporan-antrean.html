<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Laporan Antrean — Desa Bukit Raya</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#f4f7fb;color:#172033}
button,input{font:inherit}
.hidden{display:none!important}
.wrap{max-width:1400px;margin:0 auto;padding:24px}
.card{background:#fff;border:1px solid #e3e9f2;border-radius:18px;box-shadow:0 8px 25px rgba(22,43,77,.07)}
.login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.login-card{width:100%;max-width:430px;padding:32px}
.brand{font-weight:800;font-size:26px;color:#123b72;margin-bottom:6px}
.muted{color:#667085}
label{display:block;font-weight:700;margin:18px 0 8px}
input[type=email],input[type=password],input[type=date],input[type=text]{width:100%;padding:13px 14px;border:1px solid #ccd5e2;border-radius:10px;outline:none}
input:focus{border-color:#2563eb;box-shadow:0 0 0 3px rgba(37,99,235,.1)}
.btn{border:0;border-radius:10px;padding:12px 18px;cursor:pointer;font-weight:700}
.btn-primary{background:#123b72;color:#fff}
.btn-secondary{background:#eaf0f7;color:#123b72}
.btn-danger{background:#b42318;color:#fff}
.actions{display:flex;gap:10px;flex-wrap:wrap}
.msg{margin-top:14px;padding:11px 13px;border-radius:10px;font-size:14px}
.msg.error{background:#fef3f2;color:#b42318}
.msg.ok{background:#ecfdf3;color:#027a48}
.header{display:flex;justify-content:space-between;gap:20px;align-items:center;margin-bottom:18px}
.header h1{margin:0 0 5px;font-size:28px}
.userbox{text-align:right}
.filters{padding:18px;margin-bottom:18px}
.filter-row{display:grid;grid-template-columns:220px 1fr;gap:14px;align-items:end}
.summary{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-bottom:18px}
.stat{padding:18px}
.stat .num{font-size:28px;font-weight:800;margin-top:5px}
.counter-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:18px}
.counter{padding:18px}
.counter h3{margin:0 0 8px}
.table-card{padding:18px;overflow:hidden}
.table-head{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:14px}
.table-wrap{overflow:auto}
table{width:100%;border-collapse:collapse;min-width:980px}
th,td{padding:11px 10px;border-bottom:1px solid #e7ebf0;text-align:left;vertical-align:top;font-size:14px}
th{background:#f8fafc;white-space:nowrap}
.badge{display:inline-block;padding:5px 9px;border-radius:999px;font-size:12px;font-weight:700}
.waiting{background:#fff7d6;color:#8a6200}
.called,.serving{background:#e8f1ff;color:#175cd3}
.completed{background:#ecfdf3;color:#027a48}
.skipped{background:#fef3f2;color:#b42318}
.empty{padding:35px;text-align:center;color:#667085}
.small{font-size:12px}
@media(max-width:900px){
 .summary{grid-template-columns:repeat(2,1fr)}
 .counter-grid{grid-template-columns:repeat(2,1fr)}
 .filter-row{grid-template-columns:1fr}
 .header{align-items:flex-start;flex-direction:column}
 .userbox{text-align:left}
}
@media(max-width:520px){
 .wrap{padding:14px}
 .login-card{padding:24px}
 .summary,.counter-grid{grid-template-columns:1fr}
 .header h1{font-size:23px}
}
</style>
</head>
<body>

<section id="loginView" class="login-wrap">
  <div class="card login-card">
    <div class="brand">Desa Bukit Raya</div>
    <h1 style="margin:0 0 8px">Laporan Antrean</h1>
    <p class="muted">Halaman ini khusus untuk pengguna yang memiliki akun.</p>

    <form id="loginForm">
      <label for="email">Email</label>
      <input id="email" type="email" autocomplete="username" required>

      <label for="password">Password</label>
      <input id="password" type="password" autocomplete="current-password" required>

      <button id="loginBtn" class="btn btn-primary" type="submit" style="width:100%;margin-top:22px">
        MASUK
      </button>
    </form>

    <div id="loginMsg" class="msg hidden"></div>
  </div>
</section>

<section id="reportView" class="hidden">
  <div class="wrap">
    <div class="header">
      <div>
        <h1>Laporan Antrean</h1>
        <div class="muted">Rekap pelayanan Desa Bukit Raya</div>
      </div>
      <div class="userbox">
        <div id="signedEmail" class="small muted"></div>
        <button id="logoutBtn" class="btn btn-danger" style="margin-top:8px">KELUAR</button>
      </div>
    </div>

    <div class="card filters">
      <div class="filter-row">
        <div>
          <label for="queueDate" style="margin-top:0">Tanggal</label>
          <input id="queueDate" type="date">
        </div>
        <div class="actions">
          <button id="loadBtn" class="btn btn-primary">MUAT DATA</button>
          <button id="exportBtn" class="btn btn-secondary">EXPORT CSV</button>
        </div>
      </div>
      <div id="reportMsg" class="msg hidden"></div>
    </div>

    <div class="summary">
      <div class="card stat"><div class="muted">Total</div><div id="total" class="num">0</div></div>
      <div class="card stat"><div class="muted">Menunggu</div><div id="waiting" class="num">0</div></div>
      <div class="card stat"><div class="muted">Aktif</div><div id="active" class="num">0</div></div>
      <div class="card stat"><div class="muted">Selesai</div><div id="completed" class="num">0</div></div>
      <div class="card stat"><div class="muted">Dilewati</div><div id="skipped" class="num">0</div></div>
    </div>

    <div id="counterGrid" class="counter-grid"></div>

    <div class="card table-card">
      <div class="table-head">
        <h2 style="margin:0">Detail Antrean</h2>
        <input id="search" type="text" placeholder="Cari nama / nomor / layanan..." style="max-width:360px">
      </div>
      <div id="tableWrap" class="table-wrap"></div>
    </div>
  </div>
</section>

<script>
const SUPABASE_URL = "https://pyawggjlbrvneflpsalj.supabase.co";
const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_5SdvMobBB2AvtXcJd_Scxw_rVsoqM8R";
const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);

let reportRows = [];

const $ = id => document.getElementById(id);

function todayLocal(){
  const d = new Date();
  const y = d.getFullYear();
  const m = String(d.getMonth()+1).padStart(2,'0');
  const day = String(d.getDate()).padStart(2,'0');
  return `${y}-${m}-${day}`;
}

function showLoginMsg(text, ok=false){
  $("loginMsg").textContent = text;
  $("loginMsg").className = "msg " + (ok ? "ok" : "error");
}

function showReportMsg(text, ok=false){
  $("reportMsg").textContent = text;
  $("reportMsg").className = "msg " + (ok ? "ok" : "error");
}

function statusBadge(status){
  const labels = {
    waiting:"Menunggu",
    called:"Dipanggil",
    serving:"Dilayani",
    completed:"Selesai",
    skipped:"Dilewati"
  };
  const cls = status || "";
  return `<span class="badge ${cls}">${labels[status] || status || "-"}</span>`;
}

function formatDateTime(value){
  if(!value) return "-";
  const d = new Date(value);
  if(Number.isNaN(d.getTime())) return "-";
  return d.toLocaleString("id-ID", {
    day:"2-digit", month:"2-digit", year:"numeric",
    hour:"2-digit", minute:"2-digit"
  });
}

function escapeHtml(value){
  return String(value ?? "")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}

function renderSummary(){
  const total = reportRows.length;
  const waiting = reportRows.filter(x=>x.status==="waiting").length;
  const active = reportRows.filter(x=>["called","serving"].includes(x.status)).length;
  const completed = reportRows.filter(x=>x.status==="completed").length;
  const skipped = reportRows.filter(x=>x.status==="skipped").length;

  $("total").textContent = total;
  $("waiting").textContent = waiting;
  $("active").textContent = active;
  $("completed").textContent = completed;
  $("skipped").textContent = skipped;
}

function renderCounters(){
  const codes = ["A","B","C","D"];
  const names = {"A":"Loket A","B":"Loket B","C":"Loket C","D":"Loket D"};

  $("counterGrid").innerHTML = codes.map(code=>{
    const rows = reportRows.filter(x=>x.counter_code===code);
    const completed = rows.filter(x=>x.status==="completed").length;
    const active = rows.filter(x=>["called","serving"].includes(x.status)).length;
    const waiting = rows.filter(x=>x.status==="waiting").length;
    return `
      <div class="card counter">
        <h3>${names[code]}</h3>
        <div class="small muted">Total: <b>${rows.length}</b></div>
        <div class="small">Menunggu: <b>${waiting}</b></div>
        <div class="small">Aktif: <b>${active}</b></div>
        <div class="small">Selesai: <b>${completed}</b></div>
      </div>`;
  }).join("");
}

function renderTable(){
  const term = $("search").value.trim().toLowerCase();
  const rows = reportRows.filter(x=>{
    if(!term) return true;
    return [
      x.queue_code, x.customer_name, x.service_name,
      x.counter_code, x.counter_name, x.status
    ].some(v=>String(v ?? "").toLowerCase().includes(term));
  });

  if(!rows.length){
    $("tableWrap").innerHTML = `<div class="empty">Tidak ada data antrean untuk ditampilkan.</div>`;
    return;
  }

  $("tableWrap").innerHTML = `
    <table>
      <thead>
        <tr>
          <th>No.</th>
          <th>Nomor</th>
          <th>Nama</th>
          <th>Layanan</th>
          <th>Loket</th>
          <th>Status</th>
          <th>Dibuat</th>
          <th>Dipanggil</th>
          <th>Mulai Dilayani</th>
          <th>Selesai</th>
        </tr>
      </thead>
      <tbody>
        ${rows.map((x,i)=>`
          <tr>
            <td>${i+1}</td>
            <td><b>${escapeHtml(x.queue_code)}</b></td>
            <td>${escapeHtml(x.customer_name)}</td>
            <td>${escapeHtml(x.service_name)}</td>
            <td>${escapeHtml(x.counter_code)} — ${escapeHtml(x.counter_name)}</td>
            <td>${statusBadge(x.status)}</td>
            <td>${formatDateTime(x.created_at)}</td>
            <td>${formatDateTime(x.called_at)}</td>
            <td>${formatDateTime(x.served_at)}</td>
            <td>${formatDateTime(x.completed_at)}</td>
          </tr>
        `).join("")}
      </tbody>
    </table>`;
}

async function loadReport(){
  const date = $("queueDate").value;
  if(!date) return;

  showReportMsg("Memuat data...", true);

  const { data, error } = await db.rpc("laporan_antrean", {
    p_queue_date: date
  });

  if(error){
    reportRows = [];
    renderSummary();
    renderCounters();
    renderTable();
    showReportMsg(error.message || "Gagal memuat laporan.");
    return;
  }

  reportRows = data || [];
  renderSummary();
  renderCounters();
  renderTable();
  showReportMsg(`Data ${new Date(date+"T00:00:00").toLocaleDateString("id-ID")} berhasil dimuat.`, true);
}

function exportCsv(){
  if(!reportRows.length){
    showReportMsg("Tidak ada data untuk diekspor.");
    return;
  }

  const headers = [
    "No","Nomor Antrean","Nama","Layanan","Loket","Nama Loket",
    "Status","Dibuat","Dipanggil","Mulai Dilayani","Selesai"
  ];

  const rows = reportRows.map((x,i)=>[
    i+1,x.queue_code,x.customer_name,x.service_name,x.counter_code,
    x.counter_name,x.status,x.created_at,x.called_at,x.served_at,x.completed_at
  ]);

  const csv = [headers,...rows]
    .map(row=>row.map(v=>`"${String(v ?? "").replaceAll('"','""')}"`).join(","))
    .join("\n");

  const blob = new Blob(["\uFEFF"+csv], {type:"text/csv;charset=utf-8;"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = `laporan-antrean-${$("queueDate").value}.csv`;
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
}

async function checkSession(){
  const { data, error } = await db.auth.getSession();
  if(error || !data.session){
    $("loginView").classList.remove("hidden");
    $("reportView").classList.add("hidden");
    return;
  }
  enterReport(data.session.user);
}

function enterReport(user){
  $("loginView").classList.add("hidden");
  $("reportView").classList.remove("hidden");
  $("signedEmail").textContent = user?.email ? `Masuk sebagai: ${user.email}` : "Pengguna terautentikasi";
  $("queueDate").value = todayLocal();
  loadReport();
}

$("loginForm").addEventListener("submit", async e=>{
  e.preventDefault();

  const email = $("email").value.trim();
  const password = $("password").value;

  $("loginBtn").disabled = true;
  $("loginBtn").textContent = "MEMPROSES...";
  $("loginMsg").className = "msg hidden";

  const { data, error } = await db.auth.signInWithPassword({email,password});

  $("loginBtn").disabled = false;
  $("loginBtn").textContent = "MASUK";

  if(error){
    showLoginMsg("Email atau password tidak benar, atau akun belum diizinkan.");
    return;
  }

  enterReport(data.user);
});

$("logoutBtn").addEventListener("click", async ()=>{
  await db.auth.signOut();
  reportRows = [];
  $("reportView").classList.add("hidden");
  $("loginView").classList.remove("hidden");
  $("password").value = "";
  $("loginMsg").className = "msg hidden";
});

$("loadBtn").addEventListener("click", loadReport);
$("exportBtn").addEventListener("click", exportCsv);
$("search").addEventListener("input", renderTable);

db.auth.onAuthStateChange((_event, session)=>{
  if(session){
    $("loginView").classList.add("hidden");
    $("reportView").classList.remove("hidden");
    $("signedEmail").textContent = session.user?.email ? `Masuk sebagai: ${session.user.email}` : "Pengguna terautentikasi";
  }else{
    $("reportView").classList.add("hidden");
    $("loginView").classList.remove("hidden");
  }
});

checkSession();
</script>
</body>
</html>
